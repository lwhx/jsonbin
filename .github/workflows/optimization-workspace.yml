name: Isolated optimization workspace
on:
  push:
    branches: [perf/read-path-analytics-20261009]
    paths: [.github/workflows/optimization-workspace.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - name: Package isolated sources and installed dependencies
        run: tar -czf "$RUNNER_TEMP/jsonbin-workspace.tar.gz" --exclude=./.git --exclude=./.wrangler --exclude=./dist --exclude=./test-results --exclude=./playwright-report .
      - uses: actions/upload-artifact@v4
        with:
          name: jsonbin-isolated-workspace
          path: ${{ runner.temp }}/jsonbin-workspace.tar.gz
          retention-days: 1
