name: Key usage isolated benchmark (temporary)
on:
  push:
    branches:
      - perf/api-key-kv-accounting-20261009
    paths:
      - .github/workflows/key-usage-benchmark-temp.yml
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build candidate
        run: npm run build
      - name: Measure candidate (1000 authorized requests)
        run: node scripts/bench-key-usage.mjs 1000 | tee /tmp/candidate.json
      - name: Measure previous version with same workload
        shell: bash
        run: |
          cp scripts/bench-key-usage.mjs /tmp/bench-script.mjs
          git checkout 6759117c94104307f1fbf18d8671d4cfdc2d9e88
          cp /tmp/bench-script.mjs scripts/bench-key-usage.mjs
          node --input-type=commonjs -e "const fs = require('fs'); const p='scripts/bench-key-usage.mjs'; let s=fs.readFileSync(p,'utf8'); s=s.replace(\"version: 'candidate'\",\"version: 'baseline'\").replace('counts.r2KeyPuts !== 0 || ', ''); fs.writeFileSync(p,s)"
          npm run build
          node scripts/bench-key-usage.mjs 1000 | tee /tmp/baseline.json
      - name: Upload benchmark JSON
        uses: actions/upload-artifact@v4
        with:
          name: jsonbin-key-usage-before-after
          path: |
            /tmp/candidate.json
            /tmp/baseline.json
          retention-days: 3
