name: SEC001 session regression (temporary)
on:
  push:
    branches:
      - security/session-revocation-14day-20261009
    paths:
      - '.github/workflows/verify-session-sec001.yml'
      - 'tests/session-revocation.test.mjs'
      - 'tests/security.test.mjs'
      - 'tests/browser/session-persistence.spec.ts'
      - 'src/worker/storage/sessions.ts'
      - 'src/worker/auth/session.ts'
      - 'src/worker/routes/auth.ts'
      - 'src/worker/middleware/auth.ts'
      - 'src/react-app/App.tsx'
      - 'src/react-app/features/settings/**'
      - 'src/worker/index.ts'
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - name: Session revocation test
        run: node --test tests/session-revocation.test.mjs
      - name: Existing session security tests
        run: node --test tests/security.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Persistent browser session acceptance
        run: npx playwright test tests/browser/session-persistence.spec.ts --reporter=line
