name: Session auth R2 benchmark (temporary)
on:
  push:
    branches:
      - security/session-revocation-14day-20261009
    paths:
      - '.github/workflows/bench-session-sec001.yml'
      - 'scripts/bench-session.mjs'
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - name: Run same 300-request workload before and after
        run: |
          export FEATURE_SHA="$(git rev-parse HEAD)"
          cp scripts/bench-session.mjs /tmp/jsonbin-session-bench.mjs
          git checkout main
          cp /tmp/jsonbin-session-bench.mjs scripts/bench-session.mjs
          npm run build
          echo "BASELINE main:"
          node scripts/bench-session.mjs
          rm scripts/bench-session.mjs
          git checkout "$FEATURE_SHA"
          npm run build
          echo "CANDIDATE SEC-001:"
          node scripts/bench-session.mjs
