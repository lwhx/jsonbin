name: SEC002 focused regression (temporary)
on:
  push:
    branches:
      - security/native-rate-limits-20261009
    paths:
      - '.github/workflows/verify-rate-limit-sec002.yml'
      - 'tests/rate-limit.test.mjs'
      - 'src/worker/storage/rate-limit.ts'
      - 'src/worker/storage/key-rate-limit.ts'
      - 'src/worker/middleware/auth.ts'
      - 'src/worker/env.d.ts'
      - 'wrangler.jsonc'
permissions:
  contents: read
jobs:
  rate-security:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run rate-limit security regression
        run: node --test tests/rate-limit.test.mjs
