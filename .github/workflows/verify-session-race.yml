name: SEC001 CAS caller race verification (temporary)
on:
  push:
    branches:
      - security/session-revocation-14day-20261009
    paths:
      - '.github/workflows/verify-session-race.yml'
      - 'tests/session-revocation.test.mjs'
      - 'src/worker/storage/sessions.ts'
      - 'src/worker/auth/session.ts'
      - 'src/worker/routes/auth.ts'
permissions:
  contents: read
jobs:
  session-race:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run authoritative session tests
        run: node --test tests/session-revocation.test.mjs
