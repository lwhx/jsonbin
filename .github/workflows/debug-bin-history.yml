name: Diagnose unsaved browser-back guard (temporary)
on:
  push:
    branches:
      - fix/hash-navigation-dirty-guard-20261009
    paths:
      - '.github/workflows/debug-bin-history.yml'
      - 'src/react-app/App.tsx'
      - 'src/react-app/features/bins/BinDetailPage.tsx'
      - 'tests/browser/bin-details.spec.ts'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Reproduce original test 12 times
        run: npx playwright test tests/browser/bin-details.spec.ts --grep '取消浏览器返回时恢复原历史位置且不跳过列表页' --repeat-each=12 --workers=1 --reporter=line
      - name: Upload debug screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: history-back-failures
          path: test-results/
          retention-days: 1
