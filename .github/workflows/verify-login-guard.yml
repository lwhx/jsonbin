name: Password IP guard regression (temporary)
on:
  push:
    branches:
      - security/password-login-ip-guard-20261009
    paths:
      - '.github/workflows/verify-login-guard.yml'
      - 'tests/rate-limit.test.mjs'
      - 'tests/browser/github-login.spec.ts'
      - 'src/worker/storage/rate-limit.ts'
      - 'src/worker/storage/login-guard.ts'
      - 'src/worker/routes/auth.ts'
      - 'src/react-app/App.tsx'
      - 'src/worker/index.ts'
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Run password IP security tests
        run: node --test tests/rate-limit.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Run login UI browser tests
        run: npx playwright test tests/browser/github-login.spec.ts --reporter=line
