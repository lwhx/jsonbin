name: SEC001 browser resilience (temporary)
on:
  push:
    branches:
      - security/session-revocation-14day-20261009
    paths:
      - '.github/workflows/sec001-ui-resilience.yml'
      - 'tests/browser/session-resilience.spec.ts'
      - 'src/react-app/App.tsx'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/session-resilience.spec.ts --reporter=line
